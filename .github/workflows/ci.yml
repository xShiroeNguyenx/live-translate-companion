name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # App chỉ chạy Windows (loopback WASAPI + IPolicyConfig) → CI cũng chỉ Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # bản Electron (npm ci tải ở postinstall) lấy từ GitHub Releases, đôi khi trả 504
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-ci-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-ci-${{ runner.os }}-

      # npm ci xoá node_modules trước khi cài nên thử lại là an toàn
      - name: Install dependencies (retry on network errors)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci thất bại (lần $attempt) — thử lại sau $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::npm ci thất bại 3 lần"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
