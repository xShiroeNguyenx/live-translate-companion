name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 1 job (Windows-only). Tạo release TRƯỚC bằng gh để electron-builder chỉ upload vào release sẵn có
# → tránh race khiến mỗi artifact (installer/blockmap/latest.yml) tự tạo 1 release trùng tag.
# Release tạo ở dạng DRAFT, upload xong mới công khai: nếu không, trong ~1 phút build, app đã cài
# thấy release "latest" chưa có latest.yml → electron-updater báo 404.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bản Electron (npm ci tải ở postinstall) + công cụ đóng gói (electron-builder) đều tải từ
      # GitHub Releases, đôi khi trả 504 → giữ lại giữa các lần chạy cho đỡ phải tải
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-release-${{ runner.os }}-

      # npm ci xoá node_modules trước khi cài nên thử lại là an toàn
      - name: Install dependencies (retry on network errors)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci thất bại (lần $attempt) — thử lại sau $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::npm ci thất bại 3 lần"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create GitHub Release as draft (idempotent)
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft || echo "Release đã tồn tại, bỏ qua"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish
        shell: bash
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chỉ công khai khi đủ installer + blockmap + latest.yml (thiếu → job đỏ, release vẫn draft)
      - name: Verify assets & publish release
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml "LiveTranslateCompanion-Setup-${GITHUB_REF_NAME#v}.exe" "LiveTranslateCompanion-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"; do
            echo "$assets" | grep -qxF "$f" || { echo "::error::Thiếu $f trong release"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
