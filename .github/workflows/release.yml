name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 1 job (Windows-only). Tạo release TRƯỚC bằng gh để electron-builder chỉ upload vào release sẵn có
# → tránh race khiến mỗi artifact (installer/blockmap/latest.yml) tự tạo 1 release trùng tag.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create GitHub Release (idempotent)
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || echo "Release đã tồn tại, bỏ qua"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish
        shell: bash
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
