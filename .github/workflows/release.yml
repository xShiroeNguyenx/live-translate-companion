name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 1 job duy nhất (Windows-only): typecheck → test → build → electron-builder publish.
# electron-builder tự tạo GitHub Release theo tag rồi upload installer NSIS (+ blockmap, latest.yml).
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build & publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
